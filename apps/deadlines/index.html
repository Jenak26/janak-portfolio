<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlines</title>
<meta name="description" content="Every due date on one skyline, stored on this device.">
<meta name="robots" content="noindex">
<script id="boot">try{var p=JSON.parse(localStorage.getItem("deadlines-prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme}catch(e){}</script>
<link rel="manifest" href="/deadlines/manifest.webmanifest">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deadlines">
<link rel="apple-touch-icon" href="/deadlines/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/deadlines/icon-192.png">
<link rel="preload" href="/deadlines/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
